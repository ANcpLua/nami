name: check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: The gate, or one test lane of eng/test-suites.json (plan rule 14), which the gate never runs
        type: choice
        options:
          - gate
          - m2-acceptance
        default: gate
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}-${{ inputs.lane || 'gate' }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ (inputs.lane || 'gate') == 'gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NAMI_DIAGNOSTICS_HOME: /tmp/nami-diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
      - name: Install pinned Lean policy checker
        run: |
          curl --fail --location https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          lean_toolchain="$(cat lean-toolchain)"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$lean_toolchain"
          # elan-init records the default without installing it; validation never downloads tools.
          "$HOME/.elan/bin/elan" toolchain install "$lean_toolchain"
          "$HOME/.elan/bin/elan" run "$lean_toolchain" lean --version
          "$HOME/.elan/bin/elan" run "$lean_toolchain" lean -j2 --run eng/agent-policy/Policy.lean proof
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean proofs of the host and engine protocol
        run: |
          python3 eng/proofs/anchor/anchor.py --expect eng/proofs/anchor/cited.json > /dev/null
          cd eng/proofs && bash audit/lean_audit.sh NamiProofs --spec NamiProofs.HostEngine.Verdict --min-specs 23
      - name: NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Verify
        run: ./eng/build.sh Check --Configuration Release
      - name: Keep diagnostic logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: logs
          path: ${{ env.NAMI_DIAGNOSTICS_HOME }}/
          retention-days: 1
  lane:
    # A test lane on manual start. live-nami has no entry: it reads the nami running on the Mac.
    if: ${{ (inputs.lane || 'gate') != 'gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NAMI_DIAGNOSTICS_HOME: /tmp/nami-diagnostics
      LANE: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
      - name: NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Test lane
        run: ./eng/test.sh --lane "$LANE"
      - name: Keep diagnostic logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: logs-${{ inputs.lane }}
          path: ${{ env.NAMI_DIAGNOSTICS_HOME }}/
          retention-days: 1
