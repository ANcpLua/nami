name: container
# The image, built and run. A workflow of its own, not a job of check.yml: it needs no toolchain but Docker, it
# runs on two runners (NativeAOT does not cross-compile, so each architecture is built natively), and the gate's
# Integration suite has no minutes to spare (ledger N79). Nothing is pushed to a registry.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker version --format 'client {{.Client.Version}}, server {{.Server.Version}}'
          docker build --platform "$PLATFORM" -f src/nami/Dockerfile -t nami:ci .
          test "$(docker image inspect nami:ci --format '{{.Os}}/{{.Architecture}}')" = "$PLATFORM"
      - name: Smoke
        run: eng/scripts/container_smoke.sh --image nami:ci --bind-ready
      # The image holds no debug symbols (the smoke test above checks that). The stage "symbols" of the same build
      # does; they are kept here, for the engine of exactly this image: the build IDs must be the same.
      - name: Debug symbols
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Outside the checkout: a new file in the build context would build the engine a second time.
          symbols=$RUNNER_TEMP/symbols
          docker build --platform "$PLATFORM" -f src/nami/Dockerfile --target symbols --output "type=local,dest=$symbols" .
          ls -l "$symbols"
          docker create --name nami-engine nami:ci > /dev/null
          docker cp nami-engine:/app/nami "$RUNNER_TEMP/engine"
          docker rm nami-engine > /dev/null
          image=$(readelf -n "$RUNNER_TEMP/engine" | grep 'Build ID')
          archived=$(readelf -n "$symbols/nami.dbg" | grep 'Build ID')
          echo "engine in the image:$image"
          echo "archived nami.dbg:  $archived"
          test -n "$image" && test "$image" = "$archived"
          docker image inspect nami:ci --format 'image size: {{.Size}} bytes'
          du -sb "$symbols" | awk '{ print "symbols: " $1 " bytes" }'
      - name: Keep the debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: symbols-${{ matrix.architecture }}
          path: ${{ runner.temp }}/symbols/
          if-no-files-found: error
          retention-days: 90
      - name: Compose file
        env:
          NAMI_OTLP_PROJECT_KEYS: '{"demo":[{"key":"fake-ingest-key-0001","roles":["ingest"]}]}'
        run: docker compose config --quiet
