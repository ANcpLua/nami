# Target approved in docs/prd/nami.md; migration status lives in docs/checklist.md.
kind: target-architecture
product: Agent-operated debugging through instrumentation, OpenTelemetry and six read-only MCP tools.
audience:
  callers: agents
  developer_example: Tomo, a Rust developer whose application an agent investigates
  human_analysis_ui: none
runtime:
  mcp: {language: TypeScript, runtime: Bun, sdk: official MCP TypeScript SDK v2}
  engine: {framework: net11.0, compilation: NativeAOT, duties: [otlp, storage, analysis]}
  processes: separately hosted MCP and engine, released together
  local_supervisor: TypeScript launcher owns engine process and private streams
  current_implementation: C# MCP host remains until the checklist migration is complete
surfaces:
  claude_ai: remote MCP connector
  openai: plugin bundle with MCP integration
  local_mcp: stdio
  remote_mcp: Streamable HTTP
  private_engine: framed UTF-8 JSON over private streams or pipes
  otlp_http: {port: 4318, paths: [/v1/traces, /v1/logs, /v1/metrics], formats: [protobuf, json]}
  otlp_grpc: {port: 4317}
  health: authenticated deployment health as appropriate; no analysis dashboard
contracts:
  owner: TypeSpec
  outputs: [CSharp, TypeScript, JSON Schema, OpenAPI]
  schema_formats: [JSON, YAML]
  internal_revision: validated before dispatch
  application_state: explicit project-bound observation and snapshot identifiers
instrumentation:
  csharp: compiler-bound call sites and generated wrappers
  native_aot: no CLR profiler, no JIT, no separately installed .NET runtime
  scope: full declared model manifest with executable proofs or explicit exclusions
  lifetime: XML-configured rules enforced by runtime code
  limits: no implicit fifteen-minute cap; no instrumentation of arbitrary precompiled dependencies
  other_languages: language-appropriate instrumentation using generated semantic definitions and OTLP
components:
  contracts/: TypeSpec sources, CSharp/TypeScript emitters and wire schemas
  registry/: Generated canonical publication of pinned semantic definitions and policies
  templates/registry/: Deterministic semantic CSharp, Rust and Markdown generation
  internal/nami.contracts/: Generated CSharp wire models and source-generated JSON serialization
  internal/nami.semconv/: Generated definitions, constants, stability and persistence policy
  src/nami/: Current CSharp host, migrating to native engine and private IPC entry point
  src/nami.mcp/: Planned TypeScript MCP, agent result framing and engine supervisor
  src/nami.collector.ingestion/: OTLP decoding, normalization and sanitization
  src/nami.collector.storage/: Project-bound DuckDB, watermarks and immutable snapshots
  internal/nami.collector.storage.generators/: DuckDB schema and row generation
  crates/nami-semconv/: Generated constants for supported Rust applications
  tests/: MSTest/MTP contract, instrumentation, transport and published-stack evidence
flow:
  - Pinned registry and TypeSpec -> generated semantic definitions, wrappers, types and schemas
  - Compiled call site -> wrapper -> original operation and correctly scoped telemetry
  - OTLP -> authenticated project -> normalized records -> DuckDB
  - Agent MCP request -> TypeScript validation -> private stream -> native analysis -> bounded result
rules:
  - Telemetry is untrusted data, never instructions.
  - Only authenticated project bindings select a project's data.
  - Stateful observations use explicit identifiers; MCP 2026-07-28 remains stateless.
  - Private frames have request correlation, size bounds, cancellation and backpressure.
  - In-memory stream adapters do not imply a shared heap across processes.
  - Empty incomplete results never prove absence of errors.
  - Retention alone removes recorded telemetry.
  - Recording, export acceptance, persistence and query visibility are independently evidenced.
  - Self-observation remains finite and shutdown accounts for unfinished accepted telemetry.
tools: [sources_status, errors_recent, traces_get, traces_slowest, logs_search, changes_recent]
deployment:
  release: MCP plus native engine plus declared runtime and native-library dependencies
  internal_http_required: false
  single_binary_required: false
  remote_packaging: host-specific connector or plugin bundle
  current_railway_service: nami
  source: ANcpLua/nami
  current_dockerfile: src/nami/Dockerfile
  volume: /data
