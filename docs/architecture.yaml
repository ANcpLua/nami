# Nami target architecture; implementation tasks are tracked in checklist.md.
kind: target-architecture
product: Nami ingests OpenTelemetry and answers six bounded, typed read-only tools.
runtime:
  framework: net11.0
  compilation: NativeAOT
  process: one
surfaces:
  otlp_http: {port: 4318, paths: [/v1/traces, /v1/logs, /v1/metrics], formats: [protobuf, json]}
  otlp_grpc: {port: 4317}
  mcp_http: {port: 5100, path: /mcp, session_mode: stateless}
  mcp_stdio: {argument: --stdio, diagnostics: stderr}
  health: /health
components:
  contracts/: TypeSpec inputs, results and OTel models; generated C# and JSON Schema
  registry/: Canonical materialized publication, generated from registry/source/ pinned definitions and policies
  templates/registry/: Deterministic C#, Rust and Markdown generation from the checked registry
  internal/nami.contracts/: Generated wire models and source-generated JSON serialization
  internal/nami.semconv/: Generated constants, stability, deprecation and persistence policy
  src/nami/: Kestrel host, MCP transport, six pure tools and self-telemetry
  src/nami.collector.ingestion/: OTLP decoding, normalization and sanitizer
  src/nami.collector.storage/: DuckDB per-project records, receipt times, watermarks and immutable snapshots
  internal/nami.collector.storage.generators/: DuckDB schema and row generation
  crates/nami-semconv/: Generated constants for Rust consumers
  tests/: Registry, collector and NativeAOT conformance proofs
flow:
  - Pinned registry -> checked materialization -> C#, Rust and Markdown
  - TypeSpec -> C# source-generated models and tool JSON Schema
  - OTLP -> project validation -> normalization -> DuckDB with receipt-time watermarks
  - MCP -> project-bound snapshot -> pure read tool -> bounded JSON and headline
rules:
  - Telemetry is data, never instructions.
  - A key resolves to one project; tool arguments, metadata and headers do not choose a read project.
  - Relative query times resolve against the immutable snapshot time.
  - Empty incomplete windows never imply absence of errors.
  - Retention alone removes recorded telemetry.
  - Tool output declares freshness, byte truncation and a continuation when necessary.
  - Self-telemetry exports to loopback OTLP under the Nami project.
tools: [sources_status, errors_recent, traces_get, traces_slowest, logs_search, changes_recent]
deployment:
  railway_service: nami
  source: ANcpLua/nami
  dockerfile: src/nami/Dockerfile
  volume: /data
  healthcheck: /health
