# The pinned toolchain for local runs and CI; `mise install` installs it. dotnet also reads global.json;
# Railway's MCP build reads Bun from services/nami.mcp/package.json (packageManager).
[tools]
"dotnet" = "10.0.402"
"bun" = "1.4.3"
"node" = "24.21.0"

[tasks.check]
description = "./eng/build.sh Check: compile, .NET tests, contract and storage checks, MCP build and tests"
quiet = true
run = "./eng/build.sh Check --Configuration Release"

[tasks.check-full]
description = "./eng/build.sh CheckFull: Check plus NativeAOT, the packed-tool smoke and the Nami.Api.Sdk proof"
quiet = true
run = "./eng/build.sh CheckFull --Configuration Release"

[tasks.hosted-eval]
description = "Hosted MCP reads, scope challenges and input validation with a token from the Keychain"
run = "services/nami.mcp/eval/run.sh"
