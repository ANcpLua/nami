[tools]
dotnet = "11.0.100-rc.3.26522.148"
bun = "1.4.4"
node = "24.22.2"
"github:open-telemetry/weaver" = "0.28.0"
# pino 9.14.0 is a reviewed manual release: registry signature verified and all
# 207 archive files match upstream 339f1d6c899fa584324e15c587fbd811664dd07c.
# See the local model skill for the retained review; no general trust bypass.
"npm:@modelcontextprotocol/inspector" = { version = "2.13.0", trust_policy_excludes = ["pino@9.14.0"] }

[tasks."lint:tsp"]
run = "bun run --cwd contracts lint"

[tasks.check]
run = "./eng/build.sh Check --Configuration Release"

[tasks.diagnostics]
description = "Show the single current diagnostic record for this checkout"
run = "bash ./eng/diagnostics.sh"

[tasks."contracts:verify"]
run = "bash ./eng/contracts.sh verify"

[tasks."contracts:status"]
run = "bash ./eng/contracts.sh status"

[tasks."typespec:check"]
description = "Check current npm TypeSpec releases and the installed package reference"
run = "bash ./eng/typespec.sh --check"

[tasks."typespec:update"]
description = "Update compatible TypeSpec pins, validate imports and contract parity"
run = "bash ./eng/typespec.sh --apply"

[tasks.publish]
run = "./eng/build.sh Publish --Configuration Release"

[settings]
exec_auto_install = false
task.run_auto_install = false

[tasks.agent]
run = "bash ./eng/agent.sh"

[tasks."agent:proof"]
run = "bash ./eng/agent.sh proof"
