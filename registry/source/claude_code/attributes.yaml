file_format: definition/2
# Keys that Claude Code sends and no upstream registry defines, under the names Claude Code
# uses on the wire. Sources: the capture of Claude Code 2.1.325 on 15 Nov 2026
# (tests/Nami.IntegrationTests/Fixtures/ClaudeCodeOtlp) and
# https://code.claude.com/docs/en/monitoring-usage. Every key is annotated with its producer,
# so code generation groups the keys under `claude_code` and ingest can tell them apart from
# keys that other senders may use with another meaning. A type is the type nami stores; where
# Claude Code sends another wire type, the signal's reference says so in `nami.wire_type`.
# Not defined here, so ingest drops them as unknown keys: `user.account_uuid`,
# `user.account_id` and `event.timestamp` (OpenTelemetry namespaces; identity, and a copy of
# the record's timestamp), `link.type` on the link of the llm_request span, and `gen_ai.system`,
# which the GenAI registry excludes in favour of `gen_ai.provider.name`.
attributes:
  - key: agent.name
    type: string
    stability: development
    brief: >
      Name of the agent that issued an API request, such as the subagent type `general-purpose`.
    note: >
      On `api_request` and on the cost and token counters. Absent on the main session's
      requests. Names of user-defined agents are redacted to `custom` unless
      `OTEL_LOG_TOOL_DETAILS=1`.
    examples: ["general-purpose", "custom"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: agent.source
    type: string
    stability: development
    brief: >
      Where the definition of a completed subagent came from.
    examples: ["built-in", "plugin", "userSettings"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: agent_id
    type: string
    stability: development
    brief: >
      Identifier of the subagent that produced a record; absent on the main session's records.
    note: >
      A subagent shares its parent's `session.id`. Its spans carry `gen_ai.conversation.id`
      equal to `agent_id` and hang under the parent's Agent `claude_code.tool` span.
    examples: ["afade000000000001"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: agent_path_count
    type: int
    stability: development
    brief: >
      Number of agent directories a loaded plugin declares.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: agent_type
    type: string
    stability: development
    brief: >
      Type of a completed subagent.
    note: >
      Built-in and official-marketplace agent names appear verbatim; other names are `custom`
      unless `OTEL_LOG_TOOL_DETAILS=1`.
    examples: ["general-purpose", "custom"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: anthropic.custom_base_url
    type: boolean
    stability: development
    brief: >
      Whether the session sends its model requests to a custom `ANTHROPIC_BASE_URL`.
    note: >
      Undocumented standard attribute on every record. Not persisted: it describes the
      sender's setup, not the work.
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: anthropic.plan
    type: string
    stability: development
    brief: >
      Subscription plan of the signed-in account.
    note: >
      Undocumented standard attribute on every record of a signed-in session. Not persisted:
      an account detail.
    examples: ["max"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: anthropic.provider
    type: string
    stability: development
    brief: >
      API provider the session sends its model requests to.
    note: >
      Undocumented standard attribute on every record. Persisted, because which models a
      session can use and what they cost depend on it.
    examples: ["firstParty"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: attempt
    type: int
    stability: development
    brief: >
      Number of attempts made for an API request, the first one included.
    note: >
      On `api_error`, on the `claude_code.llm_request` span and on that span's
      `gen_ai.request.attempt` span events.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: bash_argv0
    type: string
    stability: development
    brief: >
      First program of a Bash command when it is on Claude Code's fixed list, otherwise `other`.
    examples: ["git", "python", "other"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: bash_command
    type: string
    stability: development
    brief: >
      First word of a Bash command line.
    note: >
      Claude Code sends it inside the `tool_parameters` JSON of `tool_decision` and
      `tool_result`, and on the `tool.output` span event, with `OTEL_LOG_TOOL_DETAILS=1`.
      Ingest lifts it out of `tool_parameters`.
    examples: ["python3", "git"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: bash_command_class
    type: string
    stability: development
    brief: >
      Category of a Bash command's first program, from Claude Code's fixed list.
    examples: ["vcs", "lang_runtime", "package_manager", "other", "unparsed"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: body
    type: string
    stability: development
    brief: >
      A raw Anthropic Messages API request or response body.
    note: >
      On `api_request_body` and `api_response_body`, which Claude Code emits only with
      `OTEL_LOG_RAW_API_BODIES=1`. A body holds the whole conversation. Never persisted
      (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: body_ref
    type: string
    stability: development
    brief: >
      Path of the file that holds an untruncated raw API body.
    note: >
      Sent instead of `body` with `OTEL_LOG_RAW_API_BODIES=file:<dir>`. Not persisted: it
      points at conversation content on the sender's disk.
    examples: ["/scratch/bodies/00000000-0000-4000-8000-000000000001.request.json"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: cache_creation_1h_tokens
    type: int
    stability: development
    brief: >
      Tokens an API request wrote to the prompt cache with a one-hour lifetime.
    note: >
      Undocumented; part of `cache_creation_tokens`.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: cache_creation_5m_tokens
    type: int
    stability: development
    brief: >
      Tokens an API request wrote to the prompt cache with a five-minute lifetime.
    note: >
      Undocumented; part of `cache_creation_tokens`.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: cache_creation_tokens
    type: int
    stability: development
    brief: >
      Tokens an API request wrote to the prompt cache.
    note: >
      The quantity of the GenAI key `gen_ai.usage.cache_write.input_tokens`, which Claude Code
      does not send.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: cache_read_tokens
    type: int
    stability: development
    brief: >
      Tokens an API request read from the prompt cache.
    note: >
      The quantity of the GenAI key `gen_ai.usage.cache_read.input_tokens`, which Claude Code
      does not send.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: client_request_id
    type: string
    stability: development
    brief: >
      Client-generated `x-client-request-id` of an API request attempt.
    examples: ["00000000-0000-4000-8000-000000000004"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: command_path_count
    type: int
    stability: development
    brief: >
      Number of command directories a loaded plugin declares.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: content
    type: string
    stability: development
    brief: >
      Text a Read returned or a Write was asked to write.
    note: >
      On the `tool.output` span event of the `claude_code.tool` span, emitted only with
      `OTEL_LOG_TOOL_CONTENT=1`. Never persisted (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: cost_usd
    type: double
    stability: development
    brief: >
      Estimated cost of an API request in US dollars, as Claude Code computes it.
    note: >
      Per session, the sum of `cost_usd` equals the CLI's `total_cost_usd` and the sum of the
      `claude_code.cost.usage` counter (capture of 15 Nov 2026).
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: cost_usd_micros
    type: int
    stability: development
    brief: >
      Estimated cost of an API request in millionths of a US dollar: `cost_usd` times one
      million, rounded.
    note: >
      nami stores this integer per request and sums it per session. The
      `claude_code.cost.usage` counter is a cross-check and is never added to it.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: decision
    type: string
    stability: development
    brief: >
      Outcome of a permission check for a tool call.
    note: >
      `accept` or `reject` on `tool_decision` and on the `claude_code.code_edit_tool.decision`
      counter; `accept`, `reject` or `cancelled` on the `claude_code.tool.blocked_on_user` span.
    examples: ["accept", "reject", "cancelled"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: diff
    type: string
    stability: development
    brief: >
      Structured patch an Edit applied.
    note: >
      On the `tool.output` span event, with `OTEL_LOG_TOOL_CONTENT=1` and
      `OTEL_LOG_TOOL_DETAILS=1`. Never persisted (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: duration_ms
    type: int
    stability: development
    brief: >
      Duration in milliseconds of the operation a record describes.
    note: >
      `tool_result` sends it as a decimal string, every other signal as an integer; nami
      stores an integer.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: effort
    type: string
    stability: development
    brief: >
      Effort level applied to an API request; absent when Claude Code sends none.
    examples: ["low", "medium", "high", "xhigh", "max"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: enabled_via
    type: string
    stability: development
    brief: >
      How a loaded plugin came to be enabled.
    examples: ["default-enable", "user-install", "org-policy", "admin-install", "seed-mount"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: error
    type: string
    stability: development
    brief: >
      Error message of a failed tool call or API request.
    note: >
      With `OTEL_LOG_TOOL_DETAILS=1`, `tool_result` and the `claude_code.tool.execution` span
      carry a tool's full error message, which can quote file or command content; `api_error`
      and the `claude_code.llm_request` span carry the API's message. Not persisted:
      `error_type` and `error_class` carry the category.
    examples: ["Shell command failed"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: error_class
    type: string
    stability: development
    brief: >
      Short class token of a failed API request or tool execution.
    examples: ["ShellError", "Error_ENOENT", "invalid_api_key", "api_timeout"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: error_type
    type: string
    stability: development
    brief: >
      Category of a failed tool call on `tool_result`.
    examples: ["ShellError", "Error:ENOENT"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: event.sequence
    type: int
    stability: development
    brief: >
      Counter that orders Claude Code's events, from 0, per Claude Code process.
    note: >
      Counted per process rather than per session; it continues across `/clear`. `event` is an
      OpenTelemetry namespace that has no such key; if a pinned upstream registry adds one,
      this definition goes.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: file_path
    type: string
    stability: development
    brief: >
      Target file of a Read, Edit or Write tool call.
    note: >
      On the `claude_code.tool` span and the `tool.output` span event with
      `OTEL_LOG_TOOL_DETAILS=1`. A tool detail, kept in the local store.
    examples: ["/workspace/calc/calc.py"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: final_model
    type: string
    stability: development
    brief: >
      Model that produced a subagent's final response.
    examples: ["claude-haiku-5-5"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: first_content_ms
    type: int
    stability: development
    brief: >
      Milliseconds from the start of an API request to the first content block of its
      successful attempt.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: full_command
    type: string
    stability: development
    brief: >
      Command line of a Bash tool call, kept up to 4096 UTF-8 bytes.
    note: >
      On the `claude_code.tool` span, and inside the `tool_parameters` JSON of
      `tool_decision` and `tool_result`, with `OTEL_LOG_TOOL_DETAILS=1`; ingest lifts it out
      of `tool_parameters`. A tool detail, kept in the local store so that the claim check can
      compare it with the gate command. A command line can carry free text, such as a commit
      message or a heredoc, so `nami.max_utf8_bytes` bounds what ingest keeps of it.
    examples: ["python3 -m unittest -q"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
      nami.max_utf8_bytes: 4096
  - key: has_hooks
    type: boolean
    stability: development
    brief: >
      Whether a loaded plugin contributes hooks.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: has_mcp
    type: boolean
    stability: development
    brief: >
      Whether a loaded plugin contributes MCP servers.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: host_owned_mcp
    type: boolean
    stability: development
    brief: >
      Whether the SDK host manages a loaded plugin's MCP connections.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: input_tokens
    type: int
    stability: development
    brief: >
      Input tokens of an API request, without the tokens read from or written to the prompt
      cache.
    note: >
      Not the quantity of `gen_ai.usage.input_tokens`, which includes cache tokens; that total
      is `input_tokens` + `cache_read_tokens` + `cache_creation_tokens`.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: interaction.duration_ms
    type: int
    stability: development
    brief: >
      Wall-clock duration of an interaction: one user prompt and all it triggered.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: interaction.sequence
    type: int
    stability: development
    brief: >
      Counter of interactions, from 1, per Claude Code process.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: is_async
    type: boolean
    stability: development
    brief: >
      Whether a completed subagent ran in the background.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: is_built_in
    type: boolean
    stability: development
    brief: >
      Whether a completed subagent is a built-in agent type.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: language
    type: string
    stability: development
    brief: >
      Programming language of the file a code-editing decision concerned.
    examples: ["Python", "TypeScript", "unknown"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: llm_request.context
    type: string
    stability: development
    brief: >
      What the parent of a `claude_code.llm_request` span is.
    examples: ["interaction", "tool", "standalone"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: managed_settings.helper.applied
    type: string
    stability: development
    brief: >
      Whether the policy helper's output serves as the managed settings.
    examples: ["none", "output"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: managed_settings.helper.state
    type: string
    stability: development
    brief: >
      State of the managed-settings policy helper.
    examples: ["none", "ok", "exit_nonzero"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: managed_settings.source_behavior
    type: string
    stability: development
    brief: >
      How Claude Code combines managed settings sources.
    examples: ["first-wins", "merge"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: managed_settings.sources
    type: string[]
    stability: development
    brief: >
      Managed settings sources that deliver at least one policy key, highest priority first.
    examples: [["remote", "file"]]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: managed_settings.trigger
    type: string
    stability: development
    brief: >
      Why Claude Code reported its managed settings.
    examples: ["startup", "change", "refused"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: marketplace.name
    type: string
    stability: development
    brief: >
      Marketplace a plugin was installed from.
    note: >
      Third-party marketplace names are redacted to `third-party` unless
      `OTEL_LOG_TOOL_DETAILS=1`.
    examples: ["builtin", "synced", "third-party"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: message.uuid
    type: string
    stability: development
    brief: >
      UUID of the transcript entry a prompt or a response became.
    note: >
      `message` is an OpenTelemetry namespace whose keys are deprecated in favour of
      `rpc.message.*`; if a pinned upstream registry defines this key, this definition goes.
    examples: ["00000000-0000-4000-8000-000000000006"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: model
    type: string
    stability: development
    brief: >
      Model of an API request, a subagent, or the code change a counter counts.
    examples: ["claude-haiku-5-5"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: model_swapped
    type: boolean
    stability: development
    brief: >
      Whether more than one model served a subagent's requests.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: new_context
    type: string
    stability: development
    brief: >
      Content sent with a request under detailed beta tracing.
    note: >
      The user prompt on `claude_code.interaction`, the new user messages and tool results on
      `claude_code.llm_request`, a tool's result on `claude_code.tool`; emitted only with
      `ENABLE_BETA_TRACING_DETAILED=1`. Never persisted (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: organization.id
    type: string
    stability: development
    brief: >
      UUID of the signed-in account's organization.
    note: >
      Standard attribute on every record of an authenticated session. Not persisted: identity.
    examples: ["00000000-0000-4000-8000-000000000003"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: output
    type: string
    stability: development
    brief: >
      Combined output of a Bash command, or the result of an MCP, WebFetch or WebSearch call.
    note: >
      On the `tool.output` span event, with `OTEL_LOG_TOOL_CONTENT=1`. Never persisted
      (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: output_tokens
    type: int
    stability: development
    brief: >
      Output tokens of an API request.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: parent.source
    type: string
    stability: development
    brief: >
      How an interaction span got its trace parent.
    note: >
      `env` when it continued an inbound `TRACEPARENT`, `none` when it started its own trace.
    examples: ["none", "env"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: permission_mode
    type: string
    stability: development
    brief: >
      Permission mode in force when a tool call was checked.
    examples: ["default", "plan", "acceptEdits", "bypassPermissions", "dontAsk", "auto"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: plugin.name
    type: string
    stability: development
    brief: >
      Name of a loaded plugin.
    note: >
      Third-party plugin names are redacted to `third-party` unless `OTEL_LOG_TOOL_DETAILS=1`.
    examples: ["third-party"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: plugin.scope
    type: string
    stability: development
    brief: >
      Provenance category of a loaded plugin.
    examples: ["official", "community", "org", "user-local", "default-bundle"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: plugin.version
    type: string
    stability: development
    brief: >
      Version from a loaded plugin's manifest, when its name is not redacted.
    examples: ["1.3.2"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: plugin_id_hash
    type: string
    stability: development
    brief: >
      Deterministic hash of a plugin's name and marketplace.
    examples: ["da63145d0acbb62d"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: prompt
    type: string
    stability: development
    brief: >
      Text of a user prompt.
    note: >
      On `user_prompt`. Claude Code sends `<REDACTED>` unless `OTEL_LOG_USER_PROMPTS=1`.
      Never persisted, whatever its value (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: prompt.id
    type: string
    stability: development
    brief: >
      UUID that links all events produced while one user prompt is processed.
    examples: ["00000000-0000-4000-8000-000000000005"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: prompt_length
    type: int
    stability: development
    brief: >
      Length of a user prompt in characters.
    note: >
      `user_prompt` sends it as a decimal string; nami stores an integer.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: prompt_text
    type: string
    stability: development
    brief: >
      Text of a user prompt; the same value as `prompt`.
    note: >
      Never persisted, whatever its value (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: query_source
    type: string
    stability: development
    brief: >
      Subsystem that issued an API request.
    note: >
      `main` or `subagent` on the cost and token counters; names such as `sdk`,
      `repl_main_thread`, `compact`, `generate_session_title` or
      `agent:builtin:general-purpose` on events.
    examples: ["main", "subagent", "sdk", "agent:builtin:general-purpose"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: query_source_safe
    type: string
    stability: development
    brief: >
      Bounded form of `query_source` on the `claude_code.llm_request` span.
    examples: ["sdk", "generate_session_title", "agent.builtin.general-purpose", "agent.custom"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: queued_sends
    type: int
    stability: development
    brief: >
      Messages queued while an interaction ran.
    note: >
      Undocumented; observed on the `claude_code.interaction` span.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: request_id
    type: string
    stability: development
    brief: >
      ID of an API request; on tool events, of the response that contained the tool call.
    examples: ["req_011FIXTURE00000000000001"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: response
    type: string
    stability: development
    brief: >
      Text of an assistant response.
    note: >
      On `assistant_response`. Claude Code sends `<REDACTED>` unless
      `OTEL_LOG_ASSISTANT_RESPONSES=1` (or, when that is unset, `OTEL_LOG_USER_PROMPTS=1`).
      Never persisted, whatever its value (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: response.model_output
    type: string
    stability: development
    brief: >
      Text of the model's response to a request, under detailed beta tracing.
    note: >
      On `claude_code.llm_request` with `ENABLE_BETA_TRACING_DETAILED=1`. Never persisted
      (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: response_length
    type: int
    stability: development
    brief: >
      Length of an assistant response's text in characters.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: safe_mode
    type: boolean
    stability: development
    brief: >
      Whether the session started with `--safe-mode`.
    note: >
      Sent as the string `true` or `false`; nami stores a boolean.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: skill_path_count
    type: int
    stability: development
    brief: >
      Number of skill directories a loaded plugin declares.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: source
    type: string
    stability: development
    brief: >
      Where a permission decision came from, or what ended a wait for one.
    note: >
      The key coincides with the OpenTelemetry namespace `source` (`source.address`); nami
      keeps Claude Code's name.
    examples: ["config", "hook", "user_permanent", "user_temporary", "user_abort", "user_reject"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: span.type
    type: string
    stability: development
    brief: >
      Claude Code's type of a span: its name without the `claude_code.` prefix.
    note: >
      Not persisted: the span name says the same.
    examples: ["interaction", "llm_request", "tool", "tool.blocked_on_user", "tool.execution"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: speed
    type: string
    stability: development
    brief: >
      Speed mode of an API request.
    examples: ["normal", "fast"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: start_type
    type: string
    stability: development
    brief: >
      How a CLI session started.
    examples: ["fresh", "resume", "continue", "agents_view"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: stop_reason
    type: string
    stability: development
    brief: >
      The API response's `stop_reason`.
    note: >
      The same value as `gen_ai.response.finish_reasons`, which wraps it in an array.
    examples: ["end_turn", "tool_use", "max_tokens", "refusal"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: subagent_type
    type: string
    stability: development
    brief: >
      Subagent type of an Agent or Task tool call.
    note: >
      On the `claude_code.tool` span, and inside the `tool_parameters` JSON of
      `tool_decision` and `tool_result`, with `OTEL_LOG_TOOL_DETAILS=1`; ingest lifts it out
      of `tool_parameters`.
    examples: ["general-purpose"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: success
    type: boolean
    stability: development
    brief: >
      Whether a tool call or an API request succeeded.
    note: >
      `tool_result` sends the string `true` or `false`, the spans send a boolean; nami stores
      a boolean. A Bash call's status is that of its whole command line: `cmd | tail` reports
      the status of `tail`. Claude Code sends no exit code.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: system_prompt_preview
    type: string
    stability: development
    brief: >
      First 500 characters of a request's system prompt, under detailed beta tracing.
    note: >
      Never persisted (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: system_reminders
    type: string
    stability: development
    brief: >
      Text of the system reminders among a request's new messages, under detailed beta tracing.
    note: >
      Never persisted (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: terminal.type
    type: string
    stability: development
    brief: >
      Terminal type of the session, when detected.
    note: >
      Standard attribute on every record. Not persisted: it describes the sender's setup.
    examples: ["iTerm.app", "vscode", "tmux"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: tool_input
    type: string
    stability: development
    brief: >
      JSON-serialized input of a tool call.
    note: >
      On `tool_result` with `OTEL_LOG_TOOL_DETAILS=1` and on the `claude_code.tool` span under
      detailed beta tracing. It holds an Agent call's whole prompt and the old and new text of
      an Edit. Never persisted (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: tool_input_size_bytes
    type: int
    stability: development
    brief: >
      Size of a tool call's JSON-serialized input in bytes.
    note: >
      Sent as a decimal string; nami stores an integer.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: tool_name
    type: string
    stability: development
    brief: >
      Name of the tool a record concerns.
    examples: ["Bash", "Read", "Edit", "Agent", "mcp_tool"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: tool_name_safe
    type: string
    stability: development
    brief: >
      `tool_name` without user-chosen names: MCP tools appear as `mcp_other`.
    examples: ["Bash", "Edit", "mcp_other"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: tool_parameters
    type: string
    stability: development
    brief: >
      JSON object with a tool call's parameters.
    note: >
      With `OTEL_LOG_TOOL_DETAILS=1`. Bash: `bash_command`, `full_command`, `description`,
      `timeout`, `dangerouslyDisableSandbox`, and `git_commit_id` and `git_branch` after a
      commit; MCP: `mcp_server_name`, `mcp_tool_name`; Skill: `skill_name`; Agent:
      `subagent_type`. Not persisted as a whole: ingest lifts the members that the registry
      marks with `nami.wire_container` out of it and drops the rest, such as the model-written
      `description`. The commit comes from `vcs.ref.head.revision`.
    examples: ["{\"bash_command\":\"python3\",\"full_command\":\"python3 -m unittest -q\"}"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: tool_result_size_bytes
    type: int
    stability: development
    brief: >
      Size of a tool call's result in bytes.
    note: >
      Sent as a decimal string; nami stores an integer.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: tool_source
    type: string
    stability: development
    brief: >
      Origin of the tool a decision concerns.
    examples: ["builtin", "mcp", "sdk_host_builtin_mcp"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: tool_use_id
    type: string
    stability: development
    brief: >
      ID of the model's `tool_use` block; it joins `tool_decision`, `tool_result` and the tool
      spans.
    note: >
      The spans carry the same value in `gen_ai.tool.call.id`.
    examples: ["toolu_01FIXTURE000000000000001"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: false
  - key: total_tokens
    type: int
    stability: development
    brief: >
      Tokens of a subagent's final API request: its input, cache and output tokens.
    note: >
      Not a sum over the subagent's run; the cost and token counters with `query_source`
      `subagent` give that.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: total_tool_uses
    type: int
    stability: development
    brief: >
      Tool calls a subagent made over its whole run.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: ttft_ms
    type: int
    stability: development
    brief: >
      Time to the first token of an API request in milliseconds.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: type
    type: string
    stability: development
    brief: >
      What a Claude Code counter counts.
    note: >
      `input`, `output`, `cacheRead` or `cacheCreation` on `claude_code.token.usage`; `added`
      or `removed` on `claude_code.lines_of_code.count`; `user` or `cli` on
      `claude_code.active_time.total`.
    examples: ["input", "output", "cacheRead", "cacheCreation", "added", "removed", "user", "cli"]
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: user_prompt
    type: string
    stability: development
    brief: >
      Text of the user prompt that started an interaction.
    note: >
      On `claude_code.interaction`; `<REDACTED>` unless `OTEL_LOG_USER_PROMPTS=1`. Never
      persisted, whatever its value (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
  - key: user_prompt_length
    type: int
    stability: development
    brief: >
      Length in characters of the user prompt that started an interaction.
    annotations:
      nami.producer: claude_code
      nami.persisted: true
      nami.token_exempt: true
  - key: user_system_prompt
    type: string
    stability: development
    brief: >
      System prompt text given with `--system-prompt`, `--append-system-prompt` or the SDK's
      `systemPrompt`, under detailed beta tracing.
    note: >
      Never persisted (finish-line item 5).
    examples: ["<REDACTED>"]
    annotations:
      nami.producer: claude_code
      nami.persisted: false
      nami.token_exempt: false
