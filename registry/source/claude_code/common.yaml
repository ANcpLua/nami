file_format: definition/2
# Claude Code's standard attributes: it puts them on every data point, event and span.
# `user.account_uuid` and `user.account_id` arrive too; they are not defined (see
# attributes.yaml), so ingest drops them.
attribute_groups:
  - id: claude_code.common
    visibility: internal
    attributes:
      - ref: session.id
        requirement_level:
          recommended: Claude Code sends it unless `OTEL_METRICS_INCLUDE_SESSION_ID=false`; nami derives sessions from it.
      - ref: gen_ai.agent.name
        requirement_level:
          conditionally_required: When `OTEL_RESOURCE_ATTRIBUTES` sets it on the resource; Claude Code copies resource attributes onto every record.
      - ref: user.id
        requirement_level: required
      - ref: user.email
        requirement_level:
          conditionally_required: When the session is signed in.
      - ref: organization.id
        requirement_level:
          conditionally_required: When the session is authenticated.
      - ref: terminal.type
        requirement_level:
          recommended: When Claude Code detects the terminal.
      - ref: anthropic.provider
        requirement_level: required
      - ref: anthropic.plan
        requirement_level:
          conditionally_required: When the session is signed in.
      - ref: anthropic.custom_base_url
        requirement_level: required
