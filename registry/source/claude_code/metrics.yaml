file_format: definition/2
# Claude Code's counters (meter `com.anthropic.claude_code`). Claude Code exports each as a
# monotonic delta sum with double values; a unit is the one Claude Code sends.
metrics:
  - name: claude_code.session.count
    brief: Count of CLI sessions started.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: ""
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
      - ref: start_type
        requirement_level: required
  - name: claude_code.lines_of_code.count
    brief: Count of lines of code modified.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: ""
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
      - ref: type
        requirement_level: required
      - ref: model
        requirement_level: required
  - name: claude_code.pull_request.count
    brief: Number of pull requests created.
    note: >
      Documented, not in the capture of 15 Nov 2026. It carries the standard attributes only.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: ""
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
  - name: claude_code.commit.count
    brief: Number of git commits created.
    note: >
      A counter without the commit: the SHA is on the `tool_result` of the `git commit`
      command (`vcs.ref.head.revision`).
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: ""
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
  - name: claude_code.cost.usage
    brief: Cost of the Claude Code session.
    note: >
      Per session its sum equals the sum of `cost_usd` on `api_request` and the CLI's
      `total_cost_usd`. nami takes cost from `cost_usd_micros` on `api_request` and uses this
      counter only as a cross-check; the two are never added.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: USD
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
      - ref: model
        requirement_level: required
      - ref: query_source
        requirement_level: required
      - ref: effort
        requirement_level:
          conditionally_required: When Claude Code sends an effort level.
      - ref: speed
        requirement_level:
          conditionally_required: When the request ran in fast mode.
      - ref: agent.name
        requirement_level:
          conditionally_required: On a subagent's requests.
  - name: claude_code.token.usage
    brief: Number of tokens used.
    note: >
      Agrees exactly with the token counts on `api_request` (capture of 15 Nov 2026).
      `input` excludes cache tokens, as `input_tokens` does.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: tokens
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
      - ref: type
        requirement_level: required
      - ref: model
        requirement_level: required
      - ref: query_source
        requirement_level: required
      - ref: effort
        requirement_level:
          conditionally_required: When Claude Code sends an effort level.
      - ref: speed
        requirement_level:
          conditionally_required: When the request ran in fast mode.
      - ref: agent.name
        requirement_level:
          conditionally_required: On a subagent's requests.
  - name: claude_code.code_edit_tool.decision
    brief: Count of permission decisions for the code-editing tools Edit, Write and NotebookEdit.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: ""
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
      - ref: tool_name
        requirement_level: required
      - ref: decision
        requirement_level: required
      - ref: source
        requirement_level: required
      - ref: language
        requirement_level: required
  - name: claude_code.active_time.total
    brief: Total active time, without idle time.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: s
    annotations:
      nami.producer: claude_code
      nami.instrumentation_scope: com.anthropic.claude_code
    attributes:
      - ref_group: claude_code.common
      - ref: type
        requirement_level: required
