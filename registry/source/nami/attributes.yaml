file_format: definition/2
attributes:
  - key: nami.project.id
    type: string
    stability: development
    brief: >
      The nami project a resource belongs to.
    note: >
      Set on the resource by the sender. The collector files every record of the
      resource under this project; no tool argument, header or `_meta` field
      selects a project.
    examples: ["tomo", "nami"]
    annotations:
      nami.persisted: true
      nami.token_exempt: false
  - key: nami.attribute.namespace
    type: string
    stability: development
    brief: >
      The namespace of an attribute key observed during attribute discovery.
    note: >
      The key prefix up to the last dot, for example `http.request` for
      `http.request.method`.
    examples: ["http.request", "gen_ai.usage"]
    annotations:
      nami.persisted: true
      nami.token_exempt: false
  - key: nami.attribute.key
    type: string
    stability: development
    brief: >
      An attribute key observed during attribute discovery, as the sender wrote it.
    note: >
      A deprecated key is rewritten to its successor on ingest; its original
      name is kept only here.
    examples: ["http.request.method", "db.query.parameter.id"]
    annotations:
      nami.persisted: true
      nami.token_exempt: false
  - key: nami.gen_ai.tool.call.arguments_hash
    type: string
    stability: development
    brief: >
      A hash of the tool call arguments; never the arguments themselves.
    note: >
      Lets equal tool calls be grouped without persisting
      `gen_ai.tool.call.arguments`, which is not persisted.
    examples: ["sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]
    annotations:
      nami.persisted: true
      nami.token_exempt: true
