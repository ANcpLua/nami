file_format: definition/2
metrics:
  - name: nami.collector.attributes.dropped
    brief: Attributes removed by a size bound of ingest.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: "{attribute}"
  - name: nami.collector.attributes.coalesced
    brief: Alias attributes coalesced into a canonical semantic convention key.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: "{attribute}"
  - name: nami.collector.attributes.sanitization_failed
    brief: Strings the credential stage could not process.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: "{attribute}"
  - name: nami.collector.values.replaced
    brief: Values ingest replaced while keeping what carries them (an attribute key or value, a name, a status message).
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: "{value}"
    attributes:
      - ref: nami.value.replacement.reason
        requirement_level: required
  - name: resource.missing_service_name
    brief: Received resources without the required service name.
    stability: development
    requirement_level: recommended
    instrument: counter
    unit: "{resource}"
